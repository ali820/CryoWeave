name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plugins/corridor-analysis/requirements.txt
          python -m pip install -r plugins/gee-analysis/requirements.txt
          python -m pip install -r plugins/environmental-indices/requirements.txt
          python -m pip install -r plugins/lake-mapper/requirements.txt
          python -m pip install -r plugins/lake-lineage/requirements.txt
          python -m pip install -r plugins/hydro-event/requirements.txt
          python -m pip install -r plugins/insar-ops/requirements.txt
          python -m pip install -r plugins/field-multisource/requirements.txt
          python -m pip install -r plugins/model-experiments/requirements.txt
          python -m pip install -r plugins/physics-scenarios/requirements.txt
      - name: Run offline validation
        run: pnpm test
      - name: Audit production dependency tree
        run: pnpm audit --audit-level=high
