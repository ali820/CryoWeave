name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repo.py
      - run: python -m pip install -r plugins/corridor-analysis/requirements.txt
      - run: node --check plugins/research-evidence/index.js
      - run: python plugins/research-evidence/evidence_worker.py --self-test
      - run: node --check plugins/research-run/index.js
      - run: python plugins/research-run/run_worker.py --self-test
      - run: node --check plugins/corridor-analysis/index.js
      - run: python plugins/corridor-analysis/corridor_worker.py --self-test
      - run: node --check plugins/gee-analysis/index.js
      - run: python plugins/gee-analysis/gee_worker.py --self-test
